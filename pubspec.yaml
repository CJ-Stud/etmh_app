name: etmh_app
description: "ETMH — Emotional Tracker Mental Health. A calm, mindful companion for tracking daily emotions with AI-driven insights powered by Gemini."
publish_to: 'none'
version: 1.0.0+1

# ───────────────────────────────────────────────────────────────────
# Versions verified compatible on pub.dev May 2026.
# All bounds use caret (^) so pub will pick the latest patch/minor
# inside the same major. Do NOT widen the majors without re-testing.
# ───────────────────────────────────────────────────────────────────
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (aligned with firebase_ai 3.12.x transitive requirements)
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.2.0
  firebase_ai: ^3.12.0

  # State management — Provider chosen over BLoC for "simplest to deploy"
  provider: ^6.1.2

  # Local storage — hive_ce is the actively-maintained community fork
  # of Hive 2.x (the original `hive` package has been unmaintained
  # since 2023). Latest verified: hive_ce 2.19.3, hive_ce_flutter 2.3.4.
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.4

  # UI & animations
  lottie: ^3.3.1
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  collection: ^1.19.1
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.0-dev.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # NOTE: Lottie placeholder assets are included as a fallback so the build
  # never fails even before you supply real animations. Replace the JSON
  # files inside assets/lottie/ with real Lottie exports any time.
  assets:
    - assets/lottie/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/etmh_logo_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FDFBF7"
  adaptive_icon_foreground: "assets/branding/etmh_icon_foreground.png"
